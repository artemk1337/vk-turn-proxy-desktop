name: Browser demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/vk-turn-proxy-desktop/frontend/**
      - pkg/desktop-settings/settings.json
      - docs/demo/**
      - .github/workflows/demo-pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: browser-demo
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build demo
        run: python3 docs/demo/build.py "$RUNNER_TEMP/browser-demo"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/browser-demo
      - uses: actions/deploy-pages@v4
        id: deployment
